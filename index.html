<!DOCTYPE html>
<html>
  <head>
    <script src="lib/p5.min.js"></script>
    <script src="lib/p5.dom.js"></script>

    <script src="sketch.js"></script>

    <!-- add extra scripts below -->
    <script src=".\Util\toolbox.js"></script>
    <script src=".\Tools\colourPalette.js"></script>
    <script src=".\Util\helperFunctions.js"></script>

    <script src=".\Tools\freehandTool.js"></script>
    <script src=".\Tools\lineToTool.js"></script>
    <script src=".\Tools\mirrorDrawTool.js"></script>
    <script src=".\Tools\spray.js"></script>
    <script src=".\Tools\fixedShapes.js"></script>
    <script src=".\Util\undo.js"></script>
    <script src=".\Util\thicc.js"></script>
    <script src=".\Util\tabs.js"></script>
    <script src=".\Tools\eraser.js"></script>

    <script src="main.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="box header">
        My Drawing App
        <button id="clearButton">Clear</button>
        <button id="saveImageButton">Save Image</button>
        <button id="undoButton">Undo</button>
        <button id="importImageButton">Import Image</button>
        <input
          id="importFile"
          type="file"
          accept="image/*"
          style="display: none"
        />
      </div>
      <div class="box" id="sidebar">
        <div id="freehandToolContainer"></div>
      </div>
      <div id="contentBox">
        <!-- <div class="content" id="tab1"></div> -->
      </div>
      <div class="box colourPalette"></div>
      <div class="box options" id="options">
        <div id="tabsBar">
          <button onclick="addNewTab()">New Tab</button>
        </div>
        <div id="tabsContainer"></div>
      </div>
    </div>
  </body>
</html>
